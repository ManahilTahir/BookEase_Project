{% extends "base.html" %}
{% block content %}
<section class="internal-login-section">
    <div class="internal-login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="brand-icon" aria-hidden="true">✦</span>
                <h1 class="login-title">Staff Portal</h1>
                <p class="login-subtitle">{{ settings.get('business_name', 'BookEase') }} — Internal Access Only</p>
            </div>
            <form id="loginForm" class="login-form" novalidate aria-label="Staff login form">
                <div class="form-group">
                    <label class="field-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input"
                           autocomplete="username" required autofocus
                           aria-required="true" aria-describedby="username-error">
                    <span class="field-error" id="username-error" role="alert"></span>
                </div>
                <div class="form-group">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input"
                           autocomplete="current-password" required
                           aria-required="true" aria-describedby="password-error">
                    <span class="field-error" id="password-error" role="alert"></span>
                </div>
                <div class="login-error" id="loginError" style="display:none;" role="alert"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>
            <p class="login-note">This portal is for authorized staff only. For appointments, <a href="{{ url_for('public.book_page') }}">book online here</a>.</p>
        </div>
    </div>
</section>
{% endblock %}
{% block extra_scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if (!username || !password) { errEl.textContent = 'Please enter username and password.'; errEl.style.display = 'block'; return; }
    try {
        const res = await fetch('/internal/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = data.redirect;
        } else {
            errEl.textContent = data.error || 'Login failed.';
            errEl.style.display = 'block';
        }
    } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
    }
});
</script>
{% endblock %}
